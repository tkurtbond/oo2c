name: CI

# Bootstrap with the latest release tarball, build this tree with it,
# and run the test suites.  The steps are in .github/ci-build.sh, which
# can also be run locally from the top of a checkout.  The aarch64 jobs
# bootstrap from the same oo2c_64 tarball: its stage0 C depends on the
# pointer size, not on the CPU.  The freebsd job runs the same script
# in a FreeBSD VM.

# Only branch pushes: a tag points at a commit that a branch push has
# already tested.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    env:
      WORK: /tmp/oo2c-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            runner: ubuntu-latest
            image: registry.fedoraproject.org/fedora:latest
            packages: >-
              dnf install -y gcc make libtool gc-devel perl diffutils tar
              bzip2 libxslt git findutils curl gcc-c++
          - name: ubuntu
            runner: ubuntu-latest
            image: ubuntu:latest
            packages: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y
              --no-install-recommends gcc libc6-dev make libtool-bin
              libgc-dev perl xsltproc bzip2 curl ca-certificates git g++
          - name: fedora-aarch64
            runner: ubuntu-24.04-arm
            image: registry.fedoraproject.org/fedora:latest
            packages: >-
              dnf install -y gcc make libtool gc-devel perl diffutils tar
              bzip2 libxslt git findutils curl gcc-c++
          - name: ubuntu-aarch64
            runner: ubuntu-24.04-arm
            image: ubuntu:latest
            packages: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y
              --no-install-recommends gcc libc6-dev make libtool-bin
              libgc-dev perl xsltproc bzip2 curl ca-certificates git g++
    steps:
      - name: Install packages
        run: ${{ matrix.packages }}
      - uses: actions/checkout@v5
      - name: Build and test
        run: sh .github/ci-build.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.name }}
          path: |
            /tmp/oo2c-ci/*.log
            tests/*/report.html

  # FreeBSD in a QEMU VM on a Linux runner.  The VM gets a copy of the
  # checkout; ci-build.sh prints the tail of a failing log itself.
  freebsd:
    name: freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: "15.1"
          usesh: true
          copyback: false
          prepare: |
            pkg install -y gcc14 gmake boehm-gc libtool gtar libxslt perl5 curl git
          run: |
            env MAKE=gmake CC=gcc14 CPPFLAGS=-I/usr/local/include \
              LDFLAGS=-L/usr/local/lib sh .github/ci-build.sh
