name: CI

# Bootstrap with the latest release tarball, build this tree with it,
# and run the test suites.  The steps are in .github/ci-build.sh, which
# can also be run locally from the top of a checkout.  The aarch64 jobs
# bootstrap from the same oo2c_64 tarball: its stage0 C depends on the
# pointer size, not on the CPU.  The freebsd, openbsd and netbsd jobs
# run the same script in a VM, and the i386 job in a 32-bit container
# from an oo2c_32 tarball that it makes itself.

# Only branch pushes: a tag points at a commit that a branch push has
# already tested.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    env:
      WORK: /tmp/oo2c-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            runner: ubuntu-latest
            image: registry.fedoraproject.org/fedora:latest
            packages: >-
              dnf install -y gcc make libtool gc-devel perl diffutils tar
              bzip2 libxslt git findutils curl gcc-c++
          - name: ubuntu
            runner: ubuntu-latest
            image: ubuntu:latest
            packages: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y
              --no-install-recommends gcc libc6-dev make libtool-bin
              libgc-dev perl xsltproc bzip2 curl ca-certificates git g++
          - name: fedora-aarch64
            runner: ubuntu-24.04-arm
            image: registry.fedoraproject.org/fedora:latest
            packages: >-
              dnf install -y gcc make libtool gc-devel perl diffutils tar
              bzip2 libxslt git findutils curl gcc-c++
          - name: ubuntu-aarch64
            runner: ubuntu-24.04-arm
            image: ubuntu:latest
            packages: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y
              --no-install-recommends gcc libc6-dev make libtool-bin
              libgc-dev perl xsltproc bzip2 curl ca-certificates git g++
    steps:
      - name: Install packages
        run: ${{ matrix.packages }}
      - uses: actions/checkout@v5
      - name: Build and test
        run: sh .github/ci-build.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.name }}
          path: |
            /tmp/oo2c-ci/*.log
            tests/*/report.html

  # i386: there is no released oo2c_32 tarball to bootstrap from yet,
  # so build this tree on the x86-64 runner, make an oo2c_32 tarball
  # from it with "make dist32", and bootstrap from that in a 32-bit
  # Debian container.  This checks both "make dist32" and the 32-bit
  # build.
  i386:
    name: i386
    runs-on: ubuntu-latest
    env:
      T: /tmp/ci-i386
    steps:
      - uses: actions/checkout@v5
      - name: Install packages
        run: >-
          sudo apt-get update &&
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y
          --no-install-recommends gcc libc6-dev make libtool-bin
          libgc-dev perl xsltproc bzip2 curl ca-certificates git
      - name: Build oo2c on x86-64
        run: |
          mkdir -p "$T"
          git clone -q . "$T/host"
          cd "$T/host" && WORK="$T/ci64" TESTS=no sh .github/ci-build.sh
      - name: make dist32
        run: |
          git clone -q . "$T/dist/src"
          cd "$T/dist/src"
          touch configure.ac aclocal.m4
          sleep 1; touch lib/src/__config.h.in
          sleep 1; touch configure
          PATH="$T/ci64/inst/bin:$PATH" ./configure >"$T/dist.log" 2>&1
          . ./ENV
          make dist32 >>"$T/dist.log" 2>&1 || { tail -50 "$T/dist.log"; exit 1; }
          ls -l "$T"/dist/oo2c_32-*.tar.bz2
      - name: Build and test in an i386 container
        run: |
          # seccomp=unconfined: with Docker's default seccomp profile
          # (Docker 29.4, kernel 7.0 on the runner) no host name
          # resolves in a 32-bit container, on any network; 64-bit
          # containers are not affected.
          docker run --rm --platform linux/386 \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/src" -v "$T:/t" -w /src \
            i386/debian:bookworm sh -c '
              apt-get -o Acquire::Retries=3 update -q >/dev/null &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
                --no-install-recommends gcc libc6-dev make libtool-bin \
                libgc-dev perl xsltproc bzip2 git g++ >/dev/null &&
              BOOT_TARBALL=$(ls /t/dist/oo2c_32-*.tar.bz2) WORK=/t/ci32 \
                sh .github/ci-build.sh'
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-i386
          path: |
            ${{ env.T }}/*.log
            ${{ env.T }}/ci*/*.log
            tests/*/report.html

  # FreeBSD in a QEMU VM on a Linux runner.  The VM gets a copy of the
  # checkout; ci-build.sh prints the tail of a failing log itself.
  freebsd:
    name: freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: "15.1"
          usesh: true
          copyback: false
          prepare: |
            pkg install -y gcc14 gmake boehm-gc libtool gtar libxslt perl5 curl git
          run: |
            env MAKE=gmake CC=gcc14 CPPFLAGS=-I/usr/local/include \
              LDFLAGS=-L/usr/local/lib sh .github/ci-build.sh

  # OpenBSD: GNU libtool from packages must come before the base one,
  # and the base tar does not know GNU options.
  openbsd:
    name: openbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test in OpenBSD
        uses: vmactions/openbsd-vm@v1.4.9
        with:
          release: "7.9"
          copyback: false
          prepare: |
            pkg_add -I gcc%15 gmake boehm-gc libtool gtar-- libxslt curl git
          run: |
            PATH=/usr/local/bin:$PATH MAKE=gmake TAR=gtar CC=egcc \
              CPPFLAGS=-I/usr/local/include LDFLAGS=-L/usr/local/lib \
              sh .github/ci-build.sh

  # NetBSD 11.1: 11.0 has a kernel bug that crashes gc programs that
  # gmake starts directly (see PROBLEMS); the Makefile works around it.
  netbsd:
    name: netbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test in NetBSD
        uses: vmactions/netbsd-vm@v1.5.3
        with:
          release: "11.1"
          copyback: false
          prepare: |
            /usr/sbin/pkg_add gmake boehm-gc libtool-base gtar libxslt perl curl git-base
          run: |
            PATH=/usr/pkg/bin:$PATH MAKE=gmake CC=gcc \
              CPPFLAGS=-I/usr/pkg/include \
              LDFLAGS="-L/usr/pkg/lib -Wl,-R/usr/pkg/lib" \
              sh .github/ci-build.sh
